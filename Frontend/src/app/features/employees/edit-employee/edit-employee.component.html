<div class="container mt-4">
    <h2>Edit Employee</h2>

    <form (ngSubmit)="updateEmployee()" class="mt-3">

        <div class="form-label">
            <label>Name:</label>
            <input type="text" 
            [(ngModel)]="employee.name"  
            class="form-control"
            name="name" required/>
        </div>

        <div class="form-label">
            <label>Email:</label>
            <input type="email" class="form-control" [(ngModel)]="employee.email" name="email" required />
        </div>

        <div class="form-label">
            <label>Salary:</label>
            <input type="number" class="form-control" [(ngModel)]="employee.salary" name="salary" required />
        </div>

        <button type="submit" class="btn btn-primary">Update</button>
        <a class="btn btn-secondary ms-2" [routerLink]="['/employees']">Cancel</a>
    </form>
</div>
