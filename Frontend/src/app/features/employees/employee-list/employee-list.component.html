<h2>Employees</h2>

<div>
    <input type="text" placeholder="Search by name" [(ngModel)]="searchTerm" class="form-control mb-3"
    (input) ="filterEmployees()" />
</div>
<table class="table table-striped table-bordered">
  <thead>
    <tr>
      <th>Id</th>
      <th (click)="sortBy('name')" class="sortable">Name</th>
      <th (click)="sortBy('email')" class="sortable">Email</th>
      <th (click)="sortBy('salary')" class="sortable">Salary</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let employee of filteredEmployees">
      <td>{{employee.id}}</td>
      <td>{{employee.name}}</td>
      <td>{{employee.email}}</td>
      <td>{{employee.salary}}</td>
      <td>
        <button [routerLink]="['/employee', employee.id]">Edit</button>
        <button (click)="deleteEmployee(employee.id)">Delete</button>

        <!-- <a [routerLink]="['/employees', employee.id]" class="btn btn-info">View</a>
        <a [routerLink]="['/employees/edit', employee.id]" class="btn btn-warning">Edit</a>
        <button (click)="deleteEmployee(employee.id)" class="btn btn-danger">Delete</button> -->
      </td>
    </tr>
  </tbody>
</table>

<button [routerLink]="['/employee/add']">Add Employee</button>
